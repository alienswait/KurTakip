name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Testleri çalıştır
      run: |
        xcodebuild test \
          -project KurTakip.xcodeproj \
          -scheme KurTakip \
          -destination 'platform=iOS Simulator,OS=latest,name=iPhone 17'
